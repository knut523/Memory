name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "MemoryCore/**"
      - "MemoryProxy/**"
      - "MemoryPanel/**"
      - "MemoryKnowledge/**"
      - "deploy/coolify/memory-hub.Dockerfile"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: memory-core
            context: ./MemoryCore
            dockerfile: ./MemoryCore/Dockerfile
          - image: memory-proxy
            context: ./MemoryProxy
            dockerfile: ./MemoryProxy/Dockerfile
          - image: memory-hub
            context: .
            dockerfile: ./deploy/coolify/memory-hub.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
